[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[project]
name = "pm-intelligence-engine"
version = "0.1.0"
description = "A provider-neutral, human-gated signal-to-decision workflow"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.60.0"]
# Span export. `opentelemetry-sdk` is what app/telemetry.py imports; the
# langfuse client is only used in setup_tracing() to attach its span processor,
# so swapping the backend does not reach the stage or provider code.
telemetry = ["opentelemetry-sdk>=1.33.0", "langfuse>=4.0.0,<5.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    # Not optional for the suite even though it is optional for the service:
    # the tracing tests use an in-memory exporter, and without this they
    # `importorskip` — the half that proves spans carry anything would simply
    # stop running, and a skipped test reads like a passing one.
    "opentelemetry-sdk>=1.33.0",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "opentelemetry-sdk>=1.33.0",
    "langfuse>=4.0.0,<5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Test/eval code is exempt from strict function-signature typing: pytest
# fixtures make per-parameter annotation awkward for little real benefit, and
# a full pass on tests/ (~900 findings, ~85% no-untyped-def/no-untyped-call)
# would be typing the tests rather than the code they exercise. Real modules
# (app/) are held to the full strict standard.
[[tool.mypy.overrides]]
module = ["tests.*", "eval.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
]
