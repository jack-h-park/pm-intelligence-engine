name: tests

# Lint and the test suite on every pull request and every push to main.
#
# GitHub-hosted runners, deliberately: this repository is public, and a
# self-hosted runner would run a fork's pull request on the host that serves the
# engine. `pull_request` (not `pull_request_target`) gives a fork's run no secrets,
# and this workflow needs none.
#
# The companion decision-context repository is private, so the suite runs against
# tests/fixtures/decision-context-stub and deselects the tests that pin real
# prompt and product content (`requires_decision_context`). They still run under
# `make test` locally, where DECISION_CONTEXT_ROOT points at the real checkout.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DECISION_CONTEXT_ROOT: ${{ github.workspace }}/tests/fixtures/decision-context-stub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The interpreter the ops host runs the service on.
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,all]"

      - name: Lint
        run: |
          ruff check app/ tests/ eval/
          mypy app/

      - name: Tests
        run: >-
          pytest tests/unit tests/decision tests/insights tests/integration -q
          -m "not slow and not requires_decision_context"
